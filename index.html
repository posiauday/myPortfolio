<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uday Posia — Power Platform Architecture &amp; Governance</title>
    <meta
      name="description"
      content="Secure, scalable Power Platform applications, automation, data, analytics and governance — plus a reusable enterprise component design system."

    <meta name="theme-color" content="#168326" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://posiauday.github.io/myPortfolio/" />

    <!-- og:image/og:url/twitter:image must be fully-qualified — crawlers fetch
         them directly, unlike href/src, which Vite rewrites for the
         configured base path at build time. Update these if the site ever
         moves to a different domain or path. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://posiauday.github.io/myPortfolio/" />
    <meta property="og:site_name" content="Uday Posia" />
    <meta property="og:title" content="Uday Posia — Power Platform Architecture &amp; Governance" />
    <meta
      property="og:description"
      content="Project showcases and a reusable enterprise component design system for Power Platform and Microsoft 365."
    />
    <meta property="og:image" content="https://posiauday.github.io/myPortfolio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Uday Posia — I build systems people trust." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Uday Posia — Power Platform Architecture &amp; Governance" />
    <meta
      name="twitter:description"
      content="Project showcases and a reusable enterprise component design system for Power Platform and Microsoft 365."
    />
    <meta name="twitter:image" content="https://posiauday.github.io/myPortfolio/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Person structured data — every value here already appears as real,
         plain-text content elsewhere on the page (experience.js,
         certifications.js, config.js); nothing is asserted here that
         isn't. Two deliberate omissions rather than guesses: no `image`,
         since schema.org's Person.image expects an actual photo and this
         repo has none (the OG graphic is a design asset, not a headshot,
         so using it here would be a mismatched claim); and AB-410 is left
         out of hasCredential entirely, since that property asserts a
         credential is held — AB-410 is still "In Progress" per
         certifications.js, so only the completed PL-300 is listed. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Uday Posia",
        "url": "https://posiauday.github.io/myPortfolio/",
        "jobTitle": "Senior Programmer Analyst",
        "description": "Power Platform and Microsoft 365 architect — secure, scalable applications, automation, data, analytics and governance for the public sector.",
        "email": "mailto:udayposia@gmail.com",
        "sameAs": ["https://linkedin.com/in/udayposia"],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Regina",
          "addressRegion": "SK",
          "addressCountry": "CA"
        },
        "worksFor": {
          "@type": "GovernmentOrganization",
          "name": "Government of Saskatchewan — Ministry of SaskBuilds and Procurement"
        },
        "knowsAbout": [
          "Microsoft Power Apps",
          "Microsoft Power Platform",
          "Microsoft Power BI",
          "Microsoft Dynamics CRM",
          "OpenText Developer Cloud",
          "PowerShell"
        ],
        "hasCredential": [
          {
            "@type": "EducationalOccupationalCredential",
            "credentialCategory": "certification",
            "name": "Power BI Data Analyst Associate (PL-300)",
            "recognizedBy": { "@type": "Organization", "name": "Microsoft" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
